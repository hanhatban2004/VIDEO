name: Build Video

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg & fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Build video
        run: python scripts/build_video.py

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: output/video.mp4

      - name: Commit video back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p output
          git add output/video.mp4
          git commit -m "build: update video [skip ci]" || echo "no changes"
          git push
